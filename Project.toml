# Dependency hygiene (mirrors the sibling .jl packages' 2026-06-13/14 fix):
# every entry here is `using`d somewhere under src/, and every `using` under
# src/ has an entry here. `src/intelligence/string_board.jl` renders the
# CrazyWall through Luxor, so Luxor is a real runtime dependency and is
# declared below; SQLite, URIs, Gumbo, Cascadia and DuckDB were listed but
# referenced by no source, test or benchmark file, and only inflated the
# install/precompile step that the CI job must finish inside its timeout.

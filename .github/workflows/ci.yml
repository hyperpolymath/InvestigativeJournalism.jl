# SPDX-License-Identifier: MPL-2.0
name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # This job resolves, downloads and precompiles the whole dependency
    # closure (DataFrames, Images, Luxor/Cairo, VideoIO/FFMPEG, TextAnalysis,
    # Graphs, plus the four hyperpolymath packages added from git) before a
    # single test runs. On a cold ~/.julia that is a >15 minute job on the
    # 2-core runners — 15 minutes was never a budget this workload could meet,
    # and it killed the 1.11 legs mid-install without ever measuring the
    # tests. 45 minutes matches the Pages job in this repository and gives the
    # cold case real headroom; the dependency trim in Project.toml (unused
    # SQLite/URIs/Gumbo/Cascadia/DuckDB entries removed) brings the warm case
    # back under it by a wide margin.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest]
        include:
          - julia-version: '1.11'
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      - name: Install hyperpolymath-internal Julia deps from git
        # These hyperpolymath org-internal packages are NOT in any Julia
        # registry — the `registries/General` subdir of
        # hyperpolymath/julia-ecosystem is just a mirror of upstream
        # JuliaRegistries/General and doesn't contain them.
        #
        # The list is the transitive closure of internal deps from this
        # project's Project.toml: Cliodynamics, Causals, ZeroProb are
        # direct; AcceleratorGate is needed because Causals + ZeroProb
        # depend on it. Install all in a SINGLE Pkg.add call so the
        # resolver knows about all the git sources at once.
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add([
              Pkg.PackageSpec(url="https://github.com/hyperpolymath/Cliodynamics.jl"),
              Pkg.PackageSpec(url="https://github.com/hyperpolymath/Causals.jl"),
              Pkg.PackageSpec(url="https://github.com/hyperpolymath/ZeroProb.jl"),
              Pkg.PackageSpec(url="https://github.com/hyperpolymath/AcceleratorGate.jl"),
            ])
          '

      - name: Install, build, test
        run: julia --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/hyperpolymath/julia-professional-registry.git")); Pkg.instantiate(); Pkg.build(); Pkg.test()'
